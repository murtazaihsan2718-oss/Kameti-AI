<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kameti AI - Committee Manager</title>
  
  <!-- Web App Manifest & Theme -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kameti AI" />
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css?v=10.0.0" />
</head>
<body>

  <!-- Responsive Container Frame -->
  <div class="app-container-frame">
    <div class="mobile-app-shell" id="app-shell">

      <!-- Toast Notification Bar -->
      <div id="toast-notification" class="toast-notification"></div>

      <!-- Main Scrollable App Viewport -->
      <main class="app-content-viewport" id="app-viewport">
        <!-- Rendered view injected dynamically here -->
      </main>

      <!-- Floating Dock Navigation Bar matching Reference Designs -->
      <nav class="bottom-nav-dock" id="app-bottom-nav">
        <button class="dock-nav-item active" data-view="home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11h8V3H3v8zm10-8v8h8V3h-8zm-10 18h8v-8H3v8zm10 0h8v-8h-8v8z"></path></svg>
          <span>Home</span>
        </button>

        <button class="dock-nav-item" data-view="voice">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path><rect x="4" y="8" width="16" height="12" rx="4"></rect><path d="M9 13v2"></path><path d="M15 13v2"></path></svg>
          <span>Ask</span>
        </button>

        <button class="dock-nav-item" data-view="notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>Activity</span>
        </button>
      </nav>

      <!-- Shared Modal Overlay -->
      <div id="modal-overlay" class="modal-overlay">
        <div id="modal-sheet-content" class="modal-card-popup">
          <!-- Dynamically populated by modals -->
        </div>
      </div>

    </div>
  </div>

  <!-- Service Worker Registration for PWA Support -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.update();
        }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=10.0.0').catch(err => {
          console.log('[SW] Service Worker note:', err);
        });
      });
    }
  </script>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="/js/app.js?v=10.0.0"></script>
</body>
</html>
